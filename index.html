<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/JALAN_KOTA_1.js"></script>
        <script src="data/Kampung_poin_Edit_2_2.js"></script>
        <script src="data/Distrik_3.js"></script>
        <script src="data/jalan_lingkar_kabupaten_4.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: '#ffff00',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: '#ffff00',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-1.8810059035034472,136.24111994855915],[-1.8780842191535942,136.2466315441284]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleSatellite_0');
        map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
        var layer_GoogleSatellite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_0',
            opacity: 1.0,
            attribution: '<a href="https://www.google.at/permissions/geoguidelines/attr-guide.html">Map data ©2015 Google</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_GoogleSatellite_0;
        map.addLayer(layer_GoogleSatellite_0);
        function pop_JALAN_KOTA_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">NAMA_JALAN</th>\
                        <td>' + (feature.properties['NAMA_JALAN'] !== null ? autolinker.link(feature.properties['NAMA_JALAN'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_JALAN_KOTA_1_0() {
            return {
                pane: 'pane_JALAN_KOTA_1',
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'round',
                lineJoin: 'round',
                weight: 8.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        function style_JALAN_KOTA_1_1() {
            return {
                pane: 'pane_JALAN_KOTA_1',
                opacity: 1,
                color: 'rgba(243,11,23,1.0)',
                dashArray: '',
                lineCap: 'round',
                lineJoin: 'round',
                weight: 6.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_JALAN_KOTA_1');
        map.getPane('pane_JALAN_KOTA_1').style.zIndex = 401;
        map.getPane('pane_JALAN_KOTA_1').style['mix-blend-mode'] = 'normal';
        var layer_JALAN_KOTA_1 = new L.geoJson.multiStyle(json_JALAN_KOTA_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_JALAN_KOTA_1',
            layerName: 'layer_JALAN_KOTA_1',
            pane: 'pane_JALAN_KOTA_1',
            onEachFeature: pop_JALAN_KOTA_1,
            styles: [style_JALAN_KOTA_1_0,style_JALAN_KOTA_1_1,]
        });
        bounds_group.addLayer(layer_JALAN_KOTA_1);
        map.addLayer(layer_JALAN_KOTA_1);
        function pop_Kampung_poin_Edit_2_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['KAMPUNG'] !== null ? autolinker.link(feature.properties['KAMPUNG'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['DISTRIK'] !== null ? autolinker.link(feature.properties['DISTRIK'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['KABUPATEN'] !== null ? autolinker.link(feature.properties['KABUPATEN'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['PROVINSI'] !== null ? autolinker.link(feature.properties['PROVINSI'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['KET'] !== null ? autolinker.link(feature.properties['KET'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Kampung_poin_Edit_2_2_0() {
            return {
                pane: 'pane_Kampung_poin_Edit_2_2',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,255,255,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_Kampung_poin_Edit_2_2');
        map.getPane('pane_Kampung_poin_Edit_2_2').style.zIndex = 402;
        map.getPane('pane_Kampung_poin_Edit_2_2').style['mix-blend-mode'] = 'normal';
        var layer_Kampung_poin_Edit_2_2 = new L.geoJson(json_Kampung_poin_Edit_2_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Kampung_poin_Edit_2_2',
            layerName: 'layer_Kampung_poin_Edit_2_2',
            pane: 'pane_Kampung_poin_Edit_2_2',
            onEachFeature: pop_Kampung_poin_Edit_2_2,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_Kampung_poin_Edit_2_2_0(feature));
            },
        });
        bounds_group.addLayer(layer_Kampung_poin_Edit_2_2);
        map.addLayer(layer_Kampung_poin_Edit_2_2);
        function pop_Distrik_3(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td class="visible-with-data" id="Id"colspan="2"><strong>Id</strong><br />' + (feature.properties['Id'] !== null ? autolinker.link(feature.properties['Id'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2"><strong>Nama</strong><br />' + (feature.properties['Nama'] !== null ? autolinker.link(feature.properties['Nama'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Nm_Kepala'] !== null ? autolinker.link(feature.properties['Nm_Kepala'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Distrik_3_0() {
            return {
                pane: 'pane_Distrik_3',
                radius: 5.6,
                opacity: 1,
                color: 'rgba(247,225,55,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(250,255,57,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_Distrik_3');
        map.getPane('pane_Distrik_3').style.zIndex = 403;
        map.getPane('pane_Distrik_3').style['mix-blend-mode'] = 'normal';
        var layer_Distrik_3 = new L.geoJson(json_Distrik_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Distrik_3',
            layerName: 'layer_Distrik_3',
            pane: 'pane_Distrik_3',
            onEachFeature: pop_Distrik_3,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_Distrik_3_0(feature));
            },
        });
        bounds_group.addLayer(layer_Distrik_3);
        map.addLayer(layer_Distrik_3);
        function pop_jalan_lingkar_kabupaten_4(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['PANJANG_M'] !== null ? autolinker.link(feature.properties['PANJANG_M'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['FUNGSI'] !== null ? autolinker.link(feature.properties['FUNGSI'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['KONDISI'] !== null ? autolinker.link(feature.properties['KONDISI'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['NAMA'] !== null ? autolinker.link(feature.properties['NAMA'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_jalan_lingkar_kabupaten_4_0() {
            return {
                pane: 'pane_jalan_lingkar_kabupaten_4',
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'round',
                lineJoin: 'round',
                weight: 8.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        function style_jalan_lingkar_kabupaten_4_1() {
            return {
                pane: 'pane_jalan_lingkar_kabupaten_4',
                opacity: 1,
                color: 'rgba(243,11,23,1.0)',
                dashArray: '',
                lineCap: 'round',
                lineJoin: 'round',
                weight: 6.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_jalan_lingkar_kabupaten_4');
        map.getPane('pane_jalan_lingkar_kabupaten_4').style.zIndex = 404;
        map.getPane('pane_jalan_lingkar_kabupaten_4').style['mix-blend-mode'] = 'normal';
        var layer_jalan_lingkar_kabupaten_4 = new L.geoJson.multiStyle(json_jalan_lingkar_kabupaten_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_jalan_lingkar_kabupaten_4',
            layerName: 'layer_jalan_lingkar_kabupaten_4',
            pane: 'pane_jalan_lingkar_kabupaten_4',
            onEachFeature: pop_jalan_lingkar_kabupaten_4,
            styles: [style_jalan_lingkar_kabupaten_4_0,style_jalan_lingkar_kabupaten_4_1,]
        });
        bounds_group.addLayer(layer_jalan_lingkar_kabupaten_4);
        map.addLayer(layer_jalan_lingkar_kabupaten_4);
        var overlaysTree = [
            {label: '<img src="legend/jalan_lingkar_kabupaten_4.png" /> jalan_lingkar_kabupaten', layer: layer_jalan_lingkar_kabupaten_4},
            {label: '<img src="legend/Distrik_3.png" /> Distrik', layer: layer_Distrik_3},
            {label: '<img src="legend/Kampung_poin_Edit_2_2.png" /> Kampung_poin_Edit_2', layer: layer_Kampung_poin_Edit_2_2},
            {label: '<img src="legend/JALAN_KOTA_1.png" /> JALAN_KOTA', layer: layer_JALAN_KOTA_1},
            {label: "Google Satellite", layer: layer_GoogleSatellite_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        var i = 0;
        layer_Kampung_poin_Edit_2_2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['KAMPUNG'] !== null?String('<div style="color: #ffffff; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['KAMPUNG']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_Kampung_poin_Edit_2_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        var i = 0;
        layer_Distrik_3.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['Nama'] !== null?String('<div style="color: #ffffff; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['Nama']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_Distrik_3'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_JALAN_KOTA_1,layer_Kampung_poin_Edit_2_2,layer_Distrik_3,layer_jalan_lingkar_kabupaten_4]);
        map.on("zoomend", function(){
            resetLabels([layer_JALAN_KOTA_1,layer_Kampung_poin_Edit_2_2,layer_Distrik_3,layer_jalan_lingkar_kabupaten_4]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_JALAN_KOTA_1,layer_Kampung_poin_Edit_2_2,layer_Distrik_3,layer_jalan_lingkar_kabupaten_4]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_JALAN_KOTA_1,layer_Kampung_poin_Edit_2_2,layer_Distrik_3,layer_jalan_lingkar_kabupaten_4]);
        });
        </script>
    </body>
</html>
